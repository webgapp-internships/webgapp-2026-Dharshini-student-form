<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Customer Reviews</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f4f7fb;
}

/* Navbar */

nav{
    background:#003366;
    color:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:15px 60px;
}

nav h2{
    font-size:28px;
}

nav ul{
    list-style:none;
    display:flex;
}

nav ul li{
    margin-left:25px;
}

nav ul li a{
    color:white;
    text-decoration:none;
}

nav ul li a:hover{
    color:orange;
}

/* Banner */

.banner{
    background:linear-gradient(rgba(0,0,0,.5),rgba(0,0,0,.5)),
    url("https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=1200");
    background-size:cover;
    background-position:center;
    color:white;
    text-align:center;
    padding:80px 20px;
}

.banner h1{
    font-size:45px;
}

.banner p{
    margin-top:10px;
    font-size:20px;
}

/* Review Form */

.container{
    width:90%;
    max-width:700px;
    margin:40px auto;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 5px 20px rgba(0,0,0,.15);
}

.container h2{
    text-align:center;
    color:#003366;
    margin-bottom:20px;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    margin:12px 0;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:16px;
}

textarea{
    resize:none;
    height:120px;
}

button{
    width:100%;
    padding:14px;
    background:#003366;
    color:white;
    border:none;
    border-radius:5px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#0055aa;
}
nav{
    position:fixed;
    top:0;
    width:100%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    background:#003366;
    padding:15px 60px;
}

nav h2{
    color:white;
}

nav ul{
    display:flex;
    list-style:none;
}

nav ul li{
    margin-left:25px;
}

nav ul li a{
    color:white;
    text-decoration:none;
    font-size:18px;
}
nav ul li a:hover{
    color:orange;
}


/* Review Cards */

#reviews{
    width:90%;
    max-width:900px;
    margin:30px auto;
}

.review-card{
    background:white;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
    box-shadow:0 5px 15px rgba(0,0,0,.15);
}

.review-card h3{
    color:#003366;
}

.review-card p{
    margin-top:10px;
    line-height:1.6;
}

/* Footer */

footer{
    background:#003366;
    color:white;
    text-align:center;
    padding:20px;
    margin-top:40px;
}

@media(max-width:768px){

nav{
flex-direction:column;
}

nav ul{
margin-top:15px;
}

}
</style>
</head>

<body>
<nav>

<h2>🚐 Van Rental</h2>

<ul>
<li><a href="start.html">Home</a></li>
<li><a href="about.html">About</a></li>

<li><a href="vans.html">Vans</a></li>

<li><a href="booking.html">Booking</a></li>

<li><a href="contact.html">Contact</a></li>
<li><a href="review.html">Review</a></li>

</ul>
</nav>
<section class="banner">

<h1>Customer Reviews</h1>

<p>Share your experience with our Van Rental Service</p>

</section>

<div class="container">

<h2>Write a Review</h2>

<form id="reviewForm">

<input
type="text"
id="name"
placeholder="Your Name"
required>

<select id="rating">

<option>⭐⭐⭐⭐⭐ Excellent</option>
<option>⭐⭐⭐⭐ Very Good</option>
<option>⭐⭐⭐ Good</option>
<option>⭐⭐ Average</option>
<option>⭐ Poor</option>

</select>

<textarea
id="message"
placeholder="Write your review..."
required></textarea>

<button type="submit">
Submit Review
</button>

</form>

</div>

<div id="reviews"></div>

<footer>

<h2>Van Rental System</h2><br>

<p>Thank you for your valuable feedback!</p>

</footer>

<script>

document.getElementById("reviewForm").addEventListener("submit",function(e){

e.preventDefault();

let name=document.getElementById("name").value;

let rating=document.getElementById("rating").value;

let message=document.getElementById("message").value;

let card=document.createElement("div");

card.className="review-card";

card.innerHTML=`

<h3>${name}</h3>

<p>${rating}</p>

<p>${message}</p>

`;

document.getElementById("reviews").prepend(card);

document.getElementById("reviewForm").reset();

alert("Thank you! Your review has been submitted.");

});

</script>

</body>
</html>
