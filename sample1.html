<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dashboard details</title>
    <head>
        <title>Dashboard</title>
        <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
        <style>
        header{
            display: flex;
            align-items: center;
            background: grey;
            color: rgb(7, 6, 6);
            padding: 10px;
            gap: 150px;
        }
        .h1{
            color: black;
            text-shadow: 2px 2px 10px cadetblue;
        }
        button{
            padding: 15px;
            float: right;
            border:none;
            border-radius:8px;
            background:rgb(55, 58, 55);
            color:white;
            font-size:16px;
            cursor:pointer;
        }
        .container{
            display: flex;
            gap: 40px;
            justify-content: center;
        }
        .box{
            width:220px;
            height:120px;
            border:1px solid rgb(80, 75, 75);
            color:BLACK;
            padding:20px;
            box-shadow:  0 0 20px lightgray;
        }
        .box i{
            font-size:45px;
        }
        .text{
            font-size:20px;
        }
        .popup{
            display:none;
            position: fixed;
            background:white;
            width:auto;
            padding:20px;
            border-radius: 15px;
            box-shadow: 0 0 20px lightgray;
        }
        #dept:target{
            display: block;
        }
        .close{
            position:absolute;
            top:10px;
            right:10px;
            text-decoration:none;
            color:rgb(161, 122, 122);
            font-size:20px;
        }
    </style>
    </head>
    <body>
        <header>
        <div class="header-container">
        <header>
        <img src="1.jpg" height="150px" WIDTH="150PX">
        <center>
        <h1>GALAXY INSTITUTE</h1></center></header>
        </div>
            <button>
                <i class="fa-solid fa-download" ></i> Export Report</button></h2>
        </header><br><br>
        <div class="container">
            <a href="#dept" style="text-decoration: none;">
            <div class="box">
                <i class="fa-solid fa-building-columns"></i>
                <p class="text">DEPARTMENTS</p>
            </div></a>
            <div class="popup" id="dept">
            <a href="#" class="close">✖</a>
            <table border="1" cellpadding="10">
                <tr>
                <th>SNO</th>
                <th>DEPARTMENTS</th>
                </tr>
                <tr>
                <td>1</td>
                <td>Computer Science</td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>Information Technology</td>
                </tr>
                <tr>
                    <td>3</td>
                    <td>BCA</td>
                </tr>
                <tr>
                    <td>4</td>
                    <td>B.A English</td>
                </tr>
            </table>
            </div>
            <a href="student.html" style="text-decoration: none;">
            <div class="box">
                <i class="fa-solid fa-user-graduate"></i>
                <p class="text">STUDENTS</p>
            </div></a>
            <div class="box">
                <i class="fa-solid fa-percent"></i>
                <p class="text">PERCENTAGE</p>
            </div>
        </div>
    </body>
</html>
